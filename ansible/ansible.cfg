[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
stdout_callback = default
callbacks_enabled = profile_tasks

[ssh_connection]
# First connection to a brand-new instance has no known host key. accept-new
# writes it once and still refuses a *changed* key (unlike disabling checks).
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=6
